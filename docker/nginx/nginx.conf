# Sets the user and group for the worker processes
user nginx;
# The number of worker processes, 'auto' is usually best for leveraging all CPU cores
worker_processes auto;

# Sets the file path for error logs and the process ID file
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Increase the number of open file descriptors for worker processes.
# This is crucial for handling a high number of connections.
worker_rlimit_nofile 4096;

events {
    # The maximum number of simultaneous connections that can be opened by a worker process.
    # This should be equal to or greater than worker_rlimit_nofile.
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    # Enables the use of sendfile() for more efficient file transmission.

    keepalive_timeout 65;
    # Sets the timeout during which a keep-alive client connection will stay open.

    # Hide NGINX version number for security.
    server_tokens off;

    # Set generous timeouts for FastCGI (PHP-FPM) and other upstream servers.
    # This helps prevent 504 Gateway Timeout errors for long-running scripts.
    fastcgi_connect_timeout 600s;
    fastcgi_send_timeout 600s;
    fastcgi_read_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Include server block configurations from the conf.d directory.
    # This is where your site-specific file will go.
    include /etc/nginx/conf.d/*.conf;
}
